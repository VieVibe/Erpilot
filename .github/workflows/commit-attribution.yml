name: Commit attribution

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  attribution:
    name: Commit attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check author, committer and co-authors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_commit_attribution.py range "$BASE_SHA" "$HEAD_SHA"
